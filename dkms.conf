PACKAGE_NAME="brtusb"
PACKAGE_VERSION="1.1"
BUILT_MODULE_NAME[0]="brtusb"
DEST_MODULE_LOCATION[0]="/updates/drivers/bluetooth"
AUTOINSTALL="yes"
# El kernel de PikaOS se compila con clang; con gcc fallan sus flags.
MAKE[0]="make LLVM=1 -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN[0]="make LLVM=1 -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
